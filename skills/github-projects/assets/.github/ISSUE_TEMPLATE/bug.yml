name: 缺陷报告
description: 提供复现路径、实际行为及影响
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与影响
      description: 版本、影响范围及不含敏感数据的日志。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 修复验收与回归验证
